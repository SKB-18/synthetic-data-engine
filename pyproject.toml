[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-engine"
version = "0.1.0"
description = "Industrial-grade synthetic instruction mutation, quality scoring, MinHash LSH deduplication, and DPO preference synthesis engine."
authors = [{ name = "SKB-18" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0.0",
]

[project.scripts]
synthetic-engine = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
